# Secret-scan config for gitleaks (see .github/workflows/gitleaks.yml).
# Keeps every default rule; adds one narrow exception.

[extend]
useDefault = true

# The prototype's seed data (and the bundled OPEN-*.html copies built from it)
# holds invented demo QR and sponsor-link tokens, not credentials (hard rule 1:
# no real AAFE data). gitleaks' generic-api-key rule flags them. Only those two
# token formats, only under prototype/, are exempt; anything else still fails.
[[allowlists]]
description = "Invented demo QR and sponsor-link tokens in prototype seed data"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^prototype/''']
regexTarget = "match"
regexes = ['''(qr_token|portal_token)"?\s*:\s*"(AAFE-[0-9A-F]{32}|[a-z]{2}-[0-9a-z]{8})"''']

# Supabase keys that bypass every access rule (docs/keys-and-secrets.md). They belong only in
# Supabase Edge Function secrets, never in a file. The anon / publishable key is public by design;
# gitleaks' default jwt rule still flags any committed JWT, anon included, to keep keys out of the repo.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-service-role-assignment"
description = "A Supabase service_role key assigned to a variable"
regex = '''(?i)service_role_key\s*[:=]\s*["']?[A-Za-z0-9_.-]{20,}'''
keywords = ["service_role_key"]

# The "Full gala, fixed" demo data set (prototype/shared/src/seed.full-fixed.json) gives every sponsor a random
# 192-bit demo link, the format the email sender mints. They're invented demo links, not credentials. Only that
# file, the two OPEN demo files that embed it, and only that format are exempt.
[[allowlists]]
description = "Invented 192-bit demo sponsor links in the Full gala, fixed data set"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^prototype/shared/src/seed\.full-fixed\.json$''', '''^prototype/OPEN-(Staff-App|Guest-Portal)\.html$''']
regexTarget = "match"
regexes = ['''portal_token"?\s*:\s*"[A-Za-z0-9_-]{32}"''']
