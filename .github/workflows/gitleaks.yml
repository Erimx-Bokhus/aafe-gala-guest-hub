name: Secret scan

on:
  # Each pull request scans only its own commits (re-runs on each new commit to it); each merge to
  # main scans what it added; a weekly full-history scan is the backstop. Scanning the whole history
  # on every run took 15-30 minutes and used two-thirds of the month's Actions minutes.
  # Branch pushes without a PR aren't scanned until a PR is opened.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # Mondays, 06:23 UTC
  workflow_dispatch: # run a full scan by hand from the Actions tab

# A newer push to the same pull request cancels the older scan still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit range below needs the history

      # Which commits to scan. "-m --first-parent" also scans merge commits, so a secret added while
      # resolving a merge conflict is caught. The weekly and manual runs scan everything.
      - name: Choose what to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) echo "log_opts=-m --first-parent $PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT" ;;
            push)         echo "log_opts=-m --first-parent $BEFORE..$AFTER" >> "$GITHUB_OUTPUT" ;;
            *)            echo "log_opts=" >> "$GITHUB_OUTPUT" ;;
          esac

      # Runs the gitleaks CLI image directly: gitleaks-action needs a paid license
      # key for repos owned by an organization, and the CLI does not.
      - name: Scan for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          echo "Scanning: ${LOG_OPTS:-full history}"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --no-banner ${LOG_OPTS:+--log-opts="$LOG_OPTS"}
