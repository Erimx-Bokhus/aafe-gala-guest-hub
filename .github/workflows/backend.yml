name: Backend tests

on:
  push:
    branches: [main]
    paths: ['prototype/**', 'import-engine/**', '.github/workflows/backend.yml']
  # Runs on every pull request (no path filter) so it can be a required check on main;
  # a path filter would leave PRs that don't touch these folders waiting forever.
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            prototype/package-lock.json
            import-engine/package-lock.json
      - run: npm ci
      # The backend tests run real CSVs through the import engine before gl_import().
      - run: npm ci
        working-directory: import-engine
      # Runs schema.sql + seed.sql + backend.sql in an in-memory Postgres (PGlite), then the
      # portal, staff, QR, import, and email-queue checks; plus the Give Lively field-mapping checks.
      - run: npm run test:backend
