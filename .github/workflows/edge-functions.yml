name: Server function type-check

# Type-checks the Supabase Edge Functions (Give Lively sync, email sender, mock) with Deno,
# the runtime they deploy to. No keys needed: it only compiles them, it doesn't run them.
on:
  push:
    branches: [main]
    paths: ['prototype/supabase/functions/**', '.github/workflows/edge-functions.yml']
  # Every pull request, so it can be a required check on main.
  pull_request:

# A newer push to the same pull request cancels the older run still in progress (saves Actions minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read   # the hub-only check lists the pull request's files

jobs:
  edge-functions-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      # A pull request that only changes the hub (hub/**) skips the steps below: the hub doesn't affect the apps.
      # The check still reports success, so it stays a required check on main. Saves Actions minutes.
      - name: Hub-only change?
        id: scope
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^hub/'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Only hub/ changed: skipping the rest of this check."
          fi
      - uses: denoland/setup-deno@v2
        if: steps.scope.outputs.skip != 'true'
        with:
          deno-version: v2.x
      # --node-modules-dir=auto: CI has no npm install here, so Deno fetches the npm packages the
      # functions import (npm:@supabase/supabase-js) itself.
      - run: deno check --node-modules-dir=auto supabase/functions/*/index.ts
        if: steps.scope.outputs.skip != 'true'
