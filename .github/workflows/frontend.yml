name: Frontend tests, build, and demo data

on:
  # Every pull request (no path filter) so it can be a required check on main; a path filter would leave PRs that
  # don't touch these folders waiting forever. No run after each merge into main: the pull request already tested
  # the merged code. A weekly full run on main (Monday 10:00 UTC, early morning in New York) catches anything a laptop missed, and
  # "Run workflow" on the Actions tab runs it by hand.
  pull_request:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

# A newer push to the same pull request cancels the older run still in progress (saves Actions minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  statuses: read   # the local-ci mark

jobs:
  frontend-tests-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      # The fast lane (docs/CODING-STANDARD.md): scripts/ci-local.mjs marks a commit "local-ci" after all seven checks
      # pass on it, committed and pushed. If this pull request's commit has that mark and already includes the latest
      # base branch, the code merged is exactly the code that passed, so the steps below are skipped. The mark is
      # trust-based (anyone with write access can set it); the secret scan and real-data guard always run here.
      - name: Did local CI already pass this exact code?
        id: local
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Any lookup that fails means a full run, never a failed check.
        run: |
          # The base branch as it is now (a re-run reuses the original event, whose base may be out of date).
          BASE_SHA=$(gh api "repos/$REPO/branches/$BASE_REF" --jq .commit.sha || echo unknown)
          passed=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "local-ci" and .state == "success")] | length' || echo 0)
          behind=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .behind_by || echo unknown)
          if [ "$passed" -gt 0 ] && [ "$behind" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::local-ci passed on $HEAD_SHA, which includes the latest base ($BASE_SHA): not run again."
          else
            echo "No local-ci mark on this exact code (mark: $passed, commits behind the base: $behind): running in full."
          fi
      - uses: actions/checkout@v4
        if: steps.local.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.local.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototype/package-lock.json
            import-engine/package-lock.json
      - uses: actions/setup-python@v5
        if: steps.local.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - run: npm ci
        if: steps.local.outputs.skip != 'true'
      # The staff app's Give Lively import screen runs the import engine in the browser.
      - run: npm ci
        if: steps.local.outputs.skip != 'true'
        working-directory: import-engine
      # The coding standard (docs/CODING-STANDARD.md): ESLint from the repo root, zero warnings allowed.
      - run: npm ci
        if: steps.local.outputs.skip != 'true'
        working-directory: .
      - run: npm run lint
        if: steps.local.outputs.skip != 'true'
        working-directory: .
      # Unit tests: the build guard that keeps secret keys out of the browser, and app tests.
      - run: npm test
        if: steps.local.outputs.skip != 'true'
      # Demo data comes from generate_seed.py. Regenerate it first: the apps bundle seed.json.
      - run: npm run seed
        if: steps.local.outputs.skip != 'true'
      # Type-checks and builds the guest portal, the staff app and the iPad check-in app, each behind the
      # build guard that stops a secret key from reaching the browser.
      - run: npm run build
        if: steps.local.outputs.skip != 'true'
      - run: python3 scripts/make_open_files.py
        if: steps.local.outputs.skip != 'true'
      - run: python3 checkin-app/scripts/make_open_file.py
        if: steps.local.outputs.skip != 'true'
      # seed.sql, seed.json and the OPEN-*.html files must be exactly what the generator and build
      # produce, so a hand edit can't drift from the generator or ship stale demo files.
      - name: Check generated files are up to date
        if: steps.local.outputs.skip != 'true'
        run: |
          if ! git diff --exit-code --stat -- database/seed.sql shared/src/seed.json database/seed.full-as-sent.sql database/seed.full-fixed.sql shared/src/seed.full-as-sent.json shared/src/seed.full-fixed.json OPEN-Guest-Portal.html OPEN-Staff-App.html OPEN-CheckIn-App.html; then
            echo "::error::Generated demo files are out of date. In prototype/, run: npm run seed && npm run build && python3 scripts/make_open_files.py && python3 checkin-app/scripts/make_open_file.py, then commit the result. Change demo data in database/generate_seed.py and generate_full_seed.py, not in the seed files."
            exit 1
          fi
