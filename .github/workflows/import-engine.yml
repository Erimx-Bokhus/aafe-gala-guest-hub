name: Import engine tests

on:
  push:
    branches: [main]
    paths: ['import-engine/**', '.github/workflows/import-engine.yml']
  pull_request:
    paths: ['import-engine/**', '.github/workflows/import-engine.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: import-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: import-engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
